<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FF9D50">
  <meta name="description" content="متابعة حفظ القرآن الكريم للطلاب بدون إنترنت">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="متابعة الحفظ">
  <script>
    (() => {
      const isGithubPages = location.hostname.endsWith('.github.io');
      const parts = location.pathname.split('/').filter(Boolean);
      const basePath = isGithubPages && parts.length ? `/${parts[0]}/` : '/';
      const validPaths = new Set([basePath, `${basePath}index.html`]);
      if (!validPaths.has(location.pathname)) {
        const hash = location.hash || '#/';
        location.replace(`${location.origin}${basePath}${hash}`);
      }
    })();
  </script>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <link rel="stylesheet" href="./assets/css/app.css">
  <script defer src="./assets/vendor/fontawesome/all.min.js"></script>
  <title>متابعة حفظ القرآن</title>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#/" aria-label="الصفحة الرئيسية"><img data-app-logo src="./assets/images/logo.svg" alt=""><div><strong data-app-name>متابعة حفظ القرآن</strong><small>متابعة يومية بسيطة</small></div></a>
      <div class="header-tools"><span class="offline-indicator" id="connection-status"><i class="fa-solid fa-circle"></i><span>جاهز بدون نت</span></span><button class="header-icon" data-backup title="نسخة احتياطية"><i class="fa-solid fa-download"></i></button></div>
    </div>
  </header>

  <main class="container main-content" id="app" aria-live="polite"></main>

  <footer class="site-footer"><div class="container"><span>تصميم وتطوير خديجة مالك</span><span data-app-version>v6.5.0</span></div></footer>
  <input id="restore-input" type="file" accept="application/json,.json" hidden>
  <div id="toast-host" class="toast-host" aria-live="assertive"></div>
  <script type="module" src="./assets/js/app.js"></script>
  <script>
    const status = document.getElementById('connection-status');
    function updateConnection(){
      if(!status) return;
      const online = navigator.onLine;
      status.classList.toggle('online', online);
      status.querySelector('span').textContent = online ? 'متصل' : 'يعمل بدون نت';
    }
    addEventListener('online', updateConnection); addEventListener('offline', updateConnection); updateConnection();
  </script>
</body>
</html>
